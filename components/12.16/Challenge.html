<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Caousel Component</title>

    <style>
      /*
        SPACING SYSTEM (px)
        2 / 4 / 8 / 12 / 16 / 24 / 32 / 48 / 64 / 80 / 96 / 128

        FONT SIZE SYSTEM (px)
        10 / 12 / 14 / 16 / 18 / 20 / 24 / 30 / 36 / 44 / 52 / 62 / 74 / 86 / 98

        MAIN COLOR:#087f5b
        GREY COLOR:#343a40
        */

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: "Inter", sans-serif;
        font-weight: 600;
        color: #343a40;
        display: flex;
        justify-content: center;
        margin-top: 200px;
      }

      .page {
        width: px;
        height: 40px;
        display: flex;
        gap: 10px;
        justify-content: center;
        align-items: center;
      }
      .btn {
        border: #087f5b 2px solid;
        border-radius: 50%;
        height: 48px;
        width: 48px;
        display: flex;
        align-items: center;
        justify-content: center;
        background: none;
        cursor: pointer;
      }

      .btn:hover {
        background-color: #087f5b;
        .icon {
          color: #fff;
        }
      }
      /* 
      .btn-left {
        grid-column: 1/2;
        grid-row: 1/2;
        transform: translate();
      }

      .btn-right {
        grid-column: 10;
        transform: translate();
      } */

      .icon {
        height: 24px;
        width: 24px;
        color: #087f5b;
      }

      .number {
        color: #343a40;
        /* background-color: white; */
        border: none;
        height: 32px;
        width: 32px;
        font-size: 16px;
        font-weight: 500;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .selected,
      .number:hover {
        color: #fff;
        background-color: #087f5b;
        border-radius: 50%;
        border: none;
      }
    </style>
  </head>
  <body>
    <div class="page">
      <button class="btn btn-left">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          fill="none"
          viewBox="0 0 24 24"
          stroke-width="1.5"
          stroke="currentColor"
          class="icon"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            d="m18.75 4.5-7.5 7.5 7.5 7.5m-6-15L5.25 12l7.5 7.5"
          />
        </svg>
      </button>

      <span class="number">1</span>
      <span class="number">2</span>
      <span class="number selected">3</span>
      <span class="number">4</span>
      <span class="number">5</span>
      <span class="number">6</span>
      <span class="dots">...</span>
      <span class="number">23</span>
      <button class="btn btn-right">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          fill="none"
          viewBox="0 0 24 24"
          stroke-width="1.5"
          stroke="currentColor"
          class="icon"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            d="m5.25 4.5 7.5 7.5-7.5 7.5m6-15 7.5 7.5-7.5 7.5"
          />
        </svg>
      </button>
    </div>
  </body>
</html>
